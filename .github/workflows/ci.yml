name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_strong_password_9f3a
          POSTGRES_DB: brain_agriculture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brain_agriculture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:ci_strong_password_9f3a@localhost:5432/brain_agriculture
      ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      PEPPER_SECRET: "ci-pepper-secret-min16"
      BRASIL_API_BASE_URL: https://brasilapi.com.br/api

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests (API)
        run: pnpm test:api

      - name: Unit tests (client)
        run: pnpm test:client

      - name: Migrate
        run: node scripts/migrate.mjs

      - name: E2E
        run: pnpm test:e2e

      - name: Audit (critical)
        run: pnpm audit:ci

      - name: Build
        run: pnpm build
