name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_strong_password_9f3a
          POSTGRES_DB: brain_agriculture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brain_agriculture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      NODE_ENV: test
      PORT: "3000"
      DATABASE_URL: postgres://postgres:ci_strong_password_9f3a@localhost:5432/brain_agriculture
      ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      PEPPER_SECRET: "ci-pepper-secret-min16"
      BRASIL_API_BASE_URL: https://brasilapi.com.br/api
      THROTTLE_LIMIT: "10000"
      BENCH_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: pnpm

      - name: Preflight (Node + pnpm)
        run: pnpm preflight

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate
        run: pnpm ci:migrate

      - name: Lint
        run: pnpm lint

      - name: Unit tests (API)
        run: pnpm test:api

      - name: Unit tests (client)
        run: pnpm test:client

      - name: Coverage
        run: pnpm test:cov:ci

      - name: OpenAPI export
        run: pnpm openapi:export

      - name: OpenAPI drift check
        run: git diff --exit-code docs/openapi.json

      - name: Contract tests
        run: pnpm test:contract

      - name: E2E
        run: pnpm test:e2e

      - name: Audit (prod high+)
        run: pnpm audit:ci

      # Build (client: sem VITE_USE_MOCKS — API real / Axios)
      - name: Build
        run: pnpm build

      - name: Bundle size gates (gzip)
        run: pnpm bench:bundle

      - name: Bench HTTP gates (scale S)
        run: pnpm bench:ci

      - name: Upload OpenAPI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/openapi.json

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size
          path: docs/bench/artifacts/bundle-size.json

      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-ci
          path: |
            docs/bench/artifacts/bench-ci-S.json
            docs/bench/reports/ci-S-*.md
