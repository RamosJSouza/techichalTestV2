# Postgres efêmero — paridade com .github/workflows/ci.yml (services.postgres).
# Uso: docker compose -f docker-compose.ci.yml up -d
# Teardown: docker compose -f docker-compose.ci.yml down -v
services:
  postgres:
    image: postgres:16-alpine
    container_name: brain_ag_postgres_ci
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_strong_password_9f3a
      POSTGRES_DB: brain_agriculture
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brain_agriculture"]
      interval: 5s
      timeout: 5s
      retries: 10
